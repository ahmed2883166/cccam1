<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}نظام المقاولات{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    :root { --bg:#f5f7fa; --card:#fff; --text:#1d2433; --muted:#6b7280; --accent:#1f6feb; --line:#e5e7eb; --bad:#c62828; --good:#2e7d32; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#0f141c; --card:#171e2a; --text:#e6eaf2; --muted:#9aa4b2; --accent:#4f9cff; --line:#2a3342; --bad:#ff6b6b; --good:#6bd08a; }
    }
    :root[data-theme="dark"] { --bg:#0f141c; --card:#171e2a; --text:#e6eaf2; --muted:#9aa4b2; --accent:#4f9cff; --line:#2a3342; --bad:#ff6b6b; --good:#6bd08a; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
    header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
    header a { color:var(--accent); text-decoration:none; font-weight:600; }
    main { padding:16px; max-width:1100px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:8px; border-bottom:1px solid var(--line); text-align:right; }
    td.num, th.num { text-align:left; font-variant-numeric: tabular-nums; direction:ltr; }
    input, select, button { font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); }
    button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:12px; }
    .kpi { font-size:1.6rem; font-weight:700; }
    .muted { color:var(--muted); }
    .bad { color:var(--bad); } .good { color:var(--good); }
    .error { background:#fdecea; color:#611a15; padding:10px; border-radius:8px; margin-bottom:12px; }
    .small { font-size:.8rem; }
    .tab { padding:6px 14px; border-radius:999px; border:1px solid var(--line); color:var(--text); text-decoration:none; }
    .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn { background:var(--accent); color:#fff; padding:8px 14px; border-radius:8px; text-decoration:none; font-weight:600; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .filters input { flex:1; min-width:200px; }
    .form-grid { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); }
    .form-grid label { display:grid; gap:4px; }
    .badge { font-size:.8rem; padding:2px 10px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
    .t-asset { background:#e8f1ff; color:#1f4fa3; } .t-liability { background:#fdecea; color:#8a1f1f; }
    .t-equity { background:#f1e9ff; color:#5b2ea6; } .t-revenue { background:#e7f6ec; color:#1e6b3a; }
    .t-expense { background:#fff4e0; color:#8a5a00; }
    table.coa tr.group td { font-weight:700; background:color-mix(in srgb, var(--accent) 6%, transparent); }
    table.coa tr.inactive td { opacity:.5; }
    @media (max-width:600px) { main { padding:12px; } th, td { font-size:.9rem; } }
  </style>
</head>
<body>
  {% if user %}
  <header>
    <strong>نظام المقاولات</strong>
    <a href="/">الرئيسية</a>
    <a href="/accounts">شجرة الحسابات</a>
    <a href="/journal">قيد يومية</a>
    <a href="/invoices?kind=sales">المبيعات</a>
    <a href="/invoices?kind=purchase">المشتريات</a>
    <a href="/partners">العملاء والموردين</a>
    <a href="/payments?kind=receipt">التحصيل</a>
    <a href="/payments?kind=payment">السداد</a>
    <a href="/balances">الأرصدة</a>
    <a href="/trial-balance">ميزان المراجعة</a>
    <span class="muted" style="margin-inline-start:auto">{{ user.full_name }}</span>
    <form method="post" action="/logout" style="margin:0"><button>خروج</button></form>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
