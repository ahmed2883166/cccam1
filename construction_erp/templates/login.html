{% extends "base.html" %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:40px auto">
  <h2>تسجيل الدخول</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" style="display:grid;gap:10px">
    <label>اسم المستخدم <input name="username" required autofocus></label>
    <label>كلمة المرور <input type="password" name="password" required></label>
    <button>دخول</button>
  </form>
</div>
{% endblock %}
