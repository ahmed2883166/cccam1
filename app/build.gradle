    defaultConfig {
        applicationId 'com.tvaitranslator'
        minSdk 24
        targetSdk 28
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies { }
